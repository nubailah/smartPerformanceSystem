<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SMARTGrade Planner Pro</title>
<style>
body{font-family:'Segoe UI',sans-serif;background:#eef2f7;margin:0;padding:0;}
.header{background:linear-gradient(135deg,#5f6bdc,#8b5bbf);color:white;text-align:center;padding:20px;}
.container{max-width:1000px;margin:20px auto;background:white;padding:20px;border-radius:10px;overflow-x:auto;}
button{padding:8px 12px;margin:4px;background:#4b5bdc;color:white;border:none;border-radius:6px;cursor:pointer;}
table{width:100%;border-collapse:collapse;margin-top:10px;}
th,td{border:1px solid #ddd;padding:8px;text-align:center;}
th{background:#f3f4f7;}
input,select,textarea{width:100%;padding:6px;margin-top:3px;}
.correct{background-color:#c8e6c9;}
.wrong{background-color:#ffcdd2;}
.status{font-weight:bold;padding:4px 8px;border-radius:6px;display:inline-block;}
.pass{background:#4caf50;color:white;}
.fail{background:#f44336;color:white;}
textarea{resize:vertical;}
@media(max-width:600px){table,th,td,input,select,textarea,button{font-size:12px;padding:4px;}}
</style>
</head>
<body>

<div class="header">
<h1>SMARTGrade Planner Pro</h1>
</div>

<div style="text-align:center">
<button id="plannerBtn">Planner</button>
<button id="interventionBtn">Academic Intervention</button>
</div>

<!-- Planner Tab -->
<div class="container" id="planner">
<label>Student ID</label>
<input id="studentID" placeholder="Enter Student ID">
<button id="loadStudentBtn">Load Student</button>

<p>Name: <span id="name">-</span></p>

<table id="plannerTable">
<tr>
<th>Assessment</th><th>Max</th><th>Weight</th><th>Target</th><th>Target %</th><th>Actual</th><th>Actual %</th>
</tr>
<tr><td id="assess1"></td><td id="maxA1"></td><td id="weightA1"></td><td><input id="targetA1" oninput="calcTarget()"></td><td id="targetPctA1"></td><td id="actualA1"></td><td id="actualPctA1"></td></tr>
<tr><td id="assess2"></td><td id="maxA2"></td><td id="weightA2"></td><td><input id="targetA2" oninput="calcTarget()"></td><td id="targetPctA2"></td><td id="actualA2"></td><td id="actualPctA2"></td></tr>
<tr><td id="assess3"></td><td id="maxA3"></td><td id="weightA3"></td><td><input id="targetA3" oninput="calcTarget()"></td><td id="targetPctA3"></td><td id="actualA3"></td><td id="actualPctA3"></td></tr>
<tr><td id="assess4"></td><td id="maxA4"></td><td id="weightA4"></td><td><input id="targetA4" oninput="calcTarget()"></td><td id="targetPctA4"></td><td id="actualA4"></td><td id="actualPctA4"></td></tr>
</table>

<div>Total Target: <span id="totalTarget">0</span></div>
<div>Target Final %: <span id="targetFinalPct">0</span>%</div>
<div>Total Actual: <span id="totalActual">0</span></div>
<div>Final %: <span id="finalPercent">0</span>%</div>
<div>Predicted Grade: <span id="finalGrade">-</span></div>
<div>Risk Level: <span id="riskLevel">-</span></div>
<div>PBPA Status: <span id="pbpaStatus" class="status">-</span></div>
</div>

<!-- Intervention Tab -->
<div class="container" id="interventionPage" style="display:none">
<h2>Academic Intervention</h2>
<label>Assessment</label>
<select id="assessment"></select>
<label>Reason</label>
<textarea id="reason" style="height:80px;"></textarea>
<button id="saveInterventionBtn">Save</button>

<h3>Intervention History</h3>
<table id="interventionTable">
<tr><th>Date</th><th>Assessment</th><th>Reason</th><th>Lecturer</th><th>Advisor</th><th>Action</th></tr>
</table>
</div>

<script>
// Paste your deployed Google Apps Script Web App URL here
var url="https://script.google.com/macros/s/AKfycbzJ-eN8ggq97u1ojp8jNV0M6b_n2qzKkPtcE6QMuRmrW3lSKumoCY-Q4yaoRHx4fO8S5Q/exec";

// ===== Escape helper =====
function escapeQuote(str){if(!str)return'';return str.toString().replace(/'/g,"\\'").replace(/"/g,'\\"');}

// ===== Tab Switching =====
document.getElementById("plannerBtn").addEventListener("click", showPlanner);
document.getElementById("interventionBtn").addEventListener("click", showIntervention);
document.getElementById("loadStudentBtn").addEventListener("click", loadStudent);
document.getElementById("saveInterventionBtn").addEventListener("click", saveIntervention);

function showPlanner(){document.getElementById("planner").style.display="block";document.getElementById("interventionPage").style.display="none";}
function showIntervention(){document.getElementById("planner").style.display="none";document.getElementById("interventionPage").style.display="block";loadAssessment();loadIntervention();}

// ===== Planner Functions =====
function getGrade(p){if(p>=90)return"A+";if(p>=80)return"A";if(p>=75)return"A-";if(p>=70)return"B+";if(p>=65)return"B";if(p>=60)return"B-";if(p>=55)return"C+";if(p>=50)return"C";if(p>=45)return"C-";return"F";}
function detectRisk(p){if(p>=70)document.getElementById("riskLevel").innerText="SAFE";else if(p>=50)document.getElementById("riskLevel").innerText="MODERATE RISK";else document.getElementById("riskLevel").innerText="HIGH RISK";}
function calcTarget(){let totalTarget=0,totalTargetMax=0;for(let i=1;i<=4;i++){let target=parseFloat(document.getElementById("targetA"+i).value)||0;let max=parseFloat(document.getElementById("maxA"+i).innerText)||0;let weight=parseFloat(document.getElementById("weightA"+i).innerText)||0;let pct=(target/max)*weight;document.getElementById("targetPctA"+i).innerText=pct.toFixed(2);totalTarget+=target;if(target>0)totalTargetMax+=max;}document.getElementById("totalTarget").innerText=totalTarget.toFixed(2);let targetFinal=(totalTargetMax>0)?(totalTarget/totalTargetMax*100):0;document.getElementById("targetFinalPct").innerText=targetFinal.toFixed(2);calcActual();}
function calcActual(){let totalActual=0,totalActualMax=0;for(let i=1;i<=4;i++){let actual=parseFloat(document.getElementById("actualA"+i).innerText)||0;let target=parseFloat(document.getElementById("targetA"+i).value)||0;let max=parseFloat(document.getElementById("maxA"+i).innerText)||0;let weight=parseFloat(document.getElementById("weightA"+i).innerText)||0;let pct=(actual/max)*weight;document.getElementById("actualPctA"+i).innerText=pct.toFixed(2);if(actual>=target)document.getElementById("actualA"+i).parentNode.className="correct";else document.getElementById("actualA"+i).parentNode.className="wrong";totalActual+=actual;if(actual>0)totalActualMax+=max;}document.getElementById("totalActual").innerText=totalActual;let finalPercent=(totalActualMax>0)?(totalActual/totalActualMax*100):0;document.getElementById("finalPercent").innerText=finalPercent.toFixed(2);document.getElementById("finalGrade").innerText=getGrade(finalPercent);detectRisk(finalPercent);let allMax=0;for(let i=1;i<=3;i++)allMax+=parseFloat(document.getElementById("maxA"+i).innerText)||0;let passMark=0.45*allMax;let pbpa=document.getElementById("pbpaStatus");if(totalActual>=passMark){pbpa.innerText="PASS PBPA";pbpa.className="status pass";}else{pbpa.innerText="FAIL PBPA";pbpa.className="status fail";}}

// ===== Load Student =====
function loadStudent(){let id=document.getElementById("studentID").value;fetch(url+"?action=getStudent&id="+id).then(res=>res.json()).then(data=>{if(data.length==0){alert("ID not found");return;}document.getElementById("name").innerText=data[2];let assess=[3,8,13,18];let max=[5,10,15,20];let weight=[6,11,16,21];let actual=[7,12,17,22];let target=[4,9,14,19];for(let i=1;i<=4;i++){document.getElementById("assess"+i).innerText=data[assess[i-1]];document.getElementById("maxA"+i).innerText=data[max[i-1]];document.getElementById("weightA"+i).innerText=data[weight[i-1]];document.getElementById("actualA"+i).innerText=data[actual[i-1]];document.getElementById("targetA"+i).value=data[target[i-1]]||0;}calcTarget();}

// ===== Intervention Functions =====
function loadAssessment(){let id=document.getElementById("studentID").value;fetch(url+"?action=getAssessment&id="+id).then(res=>res.json()).then(data=>{let sel=document.getElementById("assessment");sel.innerHTML="";data.forEach(a=>{let o=document.createElement("option");o.text=a;o.value=a;sel.add(o);});});}

function saveIntervention(){let payload={action:"saveIntervention",id:document.getElementById("studentID").value,name:document.getElementById("name").innerText,assessment:document.getElementById("assessment").value,reason:document.getElementById("reason").value};fetch(url,{method:"POST",headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}).then(res=>res.json()).then(r=>{alert(r.message);if(r.ok){document.getElementById("reason").value="";loadIntervention();}});}

function loadIntervention(){let id=document.getElementById("studentID").value;fetch(url+"?action=getIntervention&id="+id).then(res=>res.json()).then(data=>{let table=document.getElementById("interventionTable");table.innerHTML='<tr><th>Date</th><th>Assessment</th><th>Reason</th><th>Lecturer</th><th>Advisor</th><th>Action</th></tr>';data.forEach(r=>{table.innerHTML+=`<tr>
<td>${r[0]}</td>
<td>${escapeQuote(r[3])}</td>
<td>${escapeQuote(r[4])}</td>
<td><textarea id="lec_${r[0]}" style="width:100%;height:80px;">${escapeQuote(r[5])}</textarea></td>
<td><textarea id="adv_${r[0]}" style="width:100%;height:80px;">${escapeQuote(r[6])}</textarea></td>
<td><button onclick="updateIntervention('${r[0]}')">Save</button> <button onclick="deleteIntervention('${r[0]}')">Delete</button></td>
</tr>`;});});}

function updateIntervention(ts){let payload={action:"updateIntervention",timestamp:ts,lecturer:document.getElementById("lec_"+ts).value,advisor:document.getElementById("adv_"+ts).value};fetch(url,{method:"POST",headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}).then(res=>res.json()).then(r=>{alert(r.message);loadIntervention();});}

function deleteIntervention(ts){if(!confirm("Confirm delete?"))return;let payload={action:"deleteIntervention",timestamp:ts};fetch(url,{method:"POST",headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}).then(res=>res.json()).then(r=>{alert(r.message);loadIntervention();});}

</script>
</body>
</html>
