<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SMARTGrade Pro</title>

<style>
body{
  font-family:'Segoe UI';
  margin:0;
  background:#eef2f7;
}

.header{
  background:linear-gradient(135deg,#5f6bdc,#8b5bbf);
  color:white;
  text-align:center;
  padding:20px;
}

.nav{
  display:flex;
  background:white;
}

.nav button{
  flex:1;
  padding:12px;
  border:none;
  cursor:pointer;
  background:#ddd;
}

.nav button.active{
  background:#5f6bdc;
  color:white;
}

.container{
  padding:15px;
}

.card{
  background:white;
  padding:15px;
  border-radius:10px;
  margin-top:10px;
}

input, select{
  width:100%;
  padding:10px;
  margin:5px 0;
}

button{
  padding:10px;
  margin-top:5px;
  background:#5f6bdc;
  color:white;
  border:none;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
}

th,td{
  border:1px solid #ddd;
  padding:6px;
  text-align:center;
}

@media(max-width:600px){
  table{font-size:12px;}
}
</style>
</head>

<body>

<div class="header">
<h2>SMARTGrade Pro</h2>
</div>

<div class="nav">
<button class="active" onclick="showTab('planner')">Planner</button>
<button onclick="showTab('intervention')">Intervention</button>
</div>

<div class="container">

<!-- PLANNER -->
<div id="plannerTab" class="card">

<input id="studentID" placeholder="Student ID">

<button onclick="loadStudent()">Load</button>
<button onclick="saveTarget()">Save Target</button>

<p>Name: <span id="name">-</span></p>

<table>
<tr><th>Assess</th><th>Max</th><th>Target</th><th>Actual</th></tr>

<tr>
<td id="assess1"></td>
<td id="maxA1"></td>
<td><input id="targetA1"></td>
<td id="actualA1"></td>
</tr>

<tr>
<td id="assess2"></td>
<td id="maxA2"></td>
<td><input id="targetA2"></td>
<td id="actualA2"></td>
</tr>

<tr>
<td id="assess3"></td>
<td id="maxA3"></td>
<td><input id="targetA3"></td>
<td id="actualA3"></td>
</tr>

<tr>
<td id="assess4"></td>
<td id="maxA4"></td>
<td><input id="targetA4"></td>
<td id="actualA4"></td>
</tr>
</table>

</div>

<!-- INTERVENTION -->
<div id="interventionTab" class="card" style="display:none">

<select id="assessment">
<option>A1</option>
<option>A2</option>
<option>A3</option>
<option>A4</option>
</select>

<input id="reason" placeholder="Reason">

<button onclick="saveIntervention()">Submit</button>

<h3>History</h3>
<table id="table"></table>

</div>

</div>

<script>

var url="https://script.google.com/macros/s/AKfycbx9Be_r8JgBYIE1DEJfWKH-deNKHwQx1mlXinfB8jNxTk_-UWwC2M8QH05F0W7v4Qtsdg/exec";

// TAB
function showTab(tab){
  plannerTab.style.display=(tab=="planner")?"block":"none";
  interventionTab.style.display=(tab=="intervention")?"block":"none";
}

// LOAD STUDENT
function loadStudent(){
  fetch(url+"?id="+studentID.value)
  .then(res=>res.json())
  .then(data=>{
    if(data.length==0){alert("No data"); return;}

    name.innerText=data[2];

    let assess=[3,8,13,18];
    let max=[5,10,15,20];
    let actual=[7,12,17,22];
    let target=[4,9,14,19];

    for(let i=1;i<=4;i++){
      document.getElementById("assess"+i).innerText=data[assess[i-1]];
      document.getElementById("maxA"+i).innerText=data[max[i-1]];
      document.getElementById("actualA"+i).innerText=data[actual[i-1]];
      document.getElementById("targetA"+i).value=data[target[i-1]];
    }
  });
}

// SAVE TARGET (GET)
function saveTarget(){
  fetch(url+"?action=saveTarget"
    +"&id="+studentID.value
    +"&t1="+targetA1.value
    +"&t2="+targetA2.value
    +"&t3="+targetA3.value
    +"&t4="+targetA4.value
  );
}

// SAVE INTERVENTION (GET)
function saveIntervention(){
  fetch(url+"?action=saveIntervention"
    +"&id="+studentID.value
    +"&assessment="+assessment.value
    +"&reason="+encodeURIComponent(reason.value)
  ).then(loadTable);
}

// LOAD TABLE
function loadTable(){
  fetch(url+"?action=getIntervention")
  .then(res=>res.json())
  .then(data=>{
    let html=`<tr>
    <th>Date</th><th>ID</th><th>Assess</th>
    <th>Reason</th><th>Lecturer</th><th>Advisor</th><th>Action</th></tr>`;

    for(let i=1;i<data.length;i++){
      let row=i+1;

      html+=`<tr>
      <td>${new Date(data[i][0]).toLocaleString()}</td>
      <td>${data[i][1]}</td>
      <td>${data[i][2]}</td>
      <td>${data[i][3]}</td>
      <td contenteditable onblur="update(${row},this.innerText,'lecturer')">${data[i][4]}</td>
      <td contenteditable onblur="update(${row},this.innerText,'advisor')">${data[i][5]}</td>
      <td><button onclick="del(${row})">X</button></td>
      </tr>`;
    }

    table.innerHTML=html;
  });
}

// UPDATE
function update(row,val,type){
  fetch(url+"?action=update"
    +"&row="+row
    +"&type="+type
    +"&value="+encodeURIComponent(val)
  );
}

// DELETE
function del(row){
  fetch(url+"?action=delete&row="+row)
  .then(loadTable);
}

window.onload=loadTable;

</script>

</body>
</html>
