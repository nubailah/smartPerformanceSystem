<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>SMARTGrade Planner</title>

<style>

body{
font-family:Segoe UI;
background:#eef2f7;
margin:0;
}

.header{
background:linear-gradient(135deg,#5f6bdc,#8b5bbf);
color:white;
text-align:center;
padding:20px;
}

.container{
max-width:1000px;
margin:auto;
background:white;
padding:20px;
border-radius:10px;
margin-top:20px;
}

button{
padding:10px;
background:#4b5bdc;
color:white;
border:none;
border-radius:5px;
cursor:pointer;
margin:5px;
}

table{
width:100%;
border-collapse:collapse;
margin-top:10px;
}

th,td{
border:1px solid #ddd;
padding:8px;
text-align:center;
}

th{
background:#f3f4f7;
}

input,select{
width:100%;
padding:8px;
margin-top:5px;
}

</style>

</head>

<body>

<div class="header">

<h1>SMARTGrade Planner</h1>

</div>

<div style="text-align:center">

<button onclick="showPlanner()">Planner</button>

<button onclick="showIntervention()">Academic Intervention</button>

</div>


<div class="container" id="planner">

<label>Student ID</label>

<input id="studentID">

<button onclick="loadStudent()">Load Student</button>

<p>Name: <span id="name"></span></p>

</div>


<div class="container" id="interventionPage" style="display:none">

<h2>Academic Intervention</h2>

<label>Assessment</label>

<select id="assessment"></select>

<label>Reason</label>

<input id="reason">

<label>Lecturer Response</label>

<input id="lecturer">

<label>Advisor Response</label>

<input id="advisor">

<button onclick="saveIntervention()">Save</button>

<h3>Intervention History</h3>

<table id="interventionTable">

<tr>
<th>Date</th>
<th>Assessment</th>
<th>Reason</th>
<th>Lecturer</th>
<th>Advisor</th>
<th>Action</th>
</tr>

</table>

</div>



<script>

var url="https://script.google.com/macros/s/AKfycbyyFR8VK349ADBSmU8OZw0Nfex0RgROxnH_8dMOasjN2NUmE90-Sxwpv_Wis-AQJbVOuA/exec";



function showPlanner(){

document.getElementById("planner").style.display="block";

document.getElementById("interventionPage").style.display="none";

}



function showIntervention(){

document.getElementById("planner").style.display="none";

document.getElementById("interventionPage").style.display="block";

loadAssessment();

loadIntervention();

}



function loadStudent(){

let id=document.getElementById("studentID").value;

fetch(url+"?action=getStudent&id="+id)

.then(res=>res.json())

.then(data=>{

document.getElementById("name").innerText=data[2];

});

}



function loadAssessment(){

let id=document.getElementById("studentID").value;

fetch(url+"?action=getAssessment&id="+id)

.then(res=>res.json())

.then(data=>{

let select=document.getElementById("assessment");

select.innerHTML="";

data.forEach(a=>{

let opt=document.createElement("option");

opt.text=a;

opt.value=a;

select.add(opt);

});

});

}



function saveIntervention(){

let payload={

id:document.getElementById("studentID").value,

name:document.getElementById("name").innerText,

assessment:document.getElementById("assessment").value,

reason:document.getElementById("reason").value,

lecturer:document.getElementById("lecturer").value,

advisor:document.getElementById("advisor").value

};

fetch(url+"?action=saveIntervention",{

method:"POST",

body:JSON.stringify(payload)

}).then(()=>{

loadIntervention();

});

}



function loadIntervention(){

let id=document.getElementById("studentID").value;

fetch(url+"?action=getIntervention&id="+id)

.then(res=>res.json())

.then(data=>{

let table=document.getElementById("interventionTable");

table.innerHTML=`<tr>
<th>Date</th>
<th>Assessment</th>
<th>Reason</th>
<th>Lecturer</th>
<th>Advisor</th>
<th>Action</th>
</tr>`;

data.forEach(r=>{

table.innerHTML+=`

<tr>

<td>${r[0]}</td>
<td>${r[3]}</td>
<td>${r[4]}</td>
<td>${r[5]}</td>
<td>${r[6]}</td>

<td>

<button onclick="deleteIntervention('${r[0]}')">Delete</button>

</td>

</tr>

`;

});

});

}



function deleteIntervention(timestamp){

fetch(url+"?action=deleteIntervention",{

method:"POST",

body:JSON.stringify({timestamp:timestamp})

}).then(()=>loadIntervention());

}

</script>

</body>

</html>
